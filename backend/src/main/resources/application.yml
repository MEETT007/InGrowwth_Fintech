spring:
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 3s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  employee-database: ${EMPLOYEE_DATABASE:./.data/employee-demo.sqlite}
  documents: ${DOCUMENT_DIR:./.data/documents}
